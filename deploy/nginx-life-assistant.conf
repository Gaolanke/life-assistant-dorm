# 生活助手 · 公开站点（同学填报 / 寝室长）
# 域名：xiaoaiyun.top  反向代理到本机 8090
# 用法：放到 /etc/nginx/sites-available/life-assistant 并 enable

server {
    listen 80;
    listen [::]:80;
    server_name xiaoaiyun.top www.xiaoaiyun.top;

    # 有证书后 80 全部跳 https；没证书时先直接放行（把下面三行注释掉）
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xiaoaiyun.top www.xiaoaiyun.top;

    # certbot 会自动填这两行
    ssl_certificate     /etc/letsencrypt/live/xiaoaiyun.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaoaiyun.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 上传名单 / 班费表可能几 MB
    client_max_body_size 20m;

    # 让后端知道真实的 IP 和协议
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8090;
    }
}
