# 生活助手 · 管理站点（管理员）
# 域名：admin.xiaoaiyun.top  反向代理到本机 8091
# 建议再加一层保护：只允许你自己的 IP 访问（把 allow 改成你的公网 IP）

server {
    listen 80;
    listen [::]:80;
    server_name admin.xiaoaiyun.top;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.xiaoaiyun.top;

    ssl_certificate     /etc/letsencrypt/live/admin.xiaoaiyun.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.xiaoaiyun.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 可选：只允许固定 IP 访问管理端（去掉注释并改成你的公网 IP）
    # allow 1.2.3.4;
    # deny all;

    client_max_body_size 20m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8091;
    }
}
