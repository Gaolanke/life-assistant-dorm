<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6feb" />
  <title>生活助手</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">🏠</div>
        <div class="brand-text">
          <strong id="brandName">生活助手</strong>
          <span id="brandSub">生活委员 · 晚归点名</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <a class="nav-item" data-page="home" href="#/home"><span class="ico">🏠</span>选择寝室</a>
        <a class="nav-item" data-page="report" href="#/report"><span class="ico">📝</span>每日填报</a>
        <a class="nav-item" data-page="dashboard" href="#/dashboard"><span class="ico">📊</span>数据看板</a>
        <a class="nav-item" data-page="stats" href="#/stats"><span class="ico">📈</span>统计图表</a>
        <a class="nav-item" data-page="records" href="#/records"><span class="ico">📚</span>填报记录</a>
        <a class="nav-item" data-page="logs" href="#/logs"><span class="ico">🧾</span>填写日志</a>
        <a class="nav-item" data-page="fund" href="#/fund"><span class="ico">💰</span>班费管理</a>
        <a class="nav-item" data-page="accounts" href="#/accounts"><span class="ico">👥</span>账号管理</a>
        <a class="nav-item" data-page="classes" href="#/classes"><span class="ico">🏫</span>班级管理</a>
        <a class="nav-item" data-page="dorms" href="#/dorms"><span class="ico">🏢</span>宿舍与人员</a>
        <a class="nav-item" data-page="push" href="#/push"><span class="ico">🤖</span>提醒推送</a>
        <a class="nav-item" data-page="console" href="#/console"><span class="ico">🔐</span>管理控制台</a>
        <a class="nav-item" data-page="config" href="#/config"><span class="ico">⚙️</span>系统配置</a>
      </nav>

      <div class="sidebar-foot">
        <div class="who" id="whoBox" title="点这里填写你是谁">
          <div class="avatar">🏠</div>
          <div class="who-text">
            <strong id="whoRole">普通填报</strong>
            <span>已选寝室：<b id="whoRoom">未选择</b></span>
          </div>
        </div>
        <div class="foot-actions">
          <button class="btn tiny ghost" id="btnSwitchRoom">换寝室</button>
          <button class="btn tiny ghost" id="btnLeaderVerify">寝室长验证</button>
          <button class="btn tiny ghost hidden" id="btnLeaderExit">退出寝室长</button>
          <button class="btn tiny ghost hidden" id="btnChangePwd">修改密码</button>
          <button class="btn tiny ghost hidden" id="btnAdminEnter">管理员进入</button>
          <button class="btn tiny ghost hidden" id="btnAdminExit">退出登录</button>
          <button class="btn tiny ghost" id="adminPortLink">管理端</button>
          <button class="btn tiny ghost hidden" id="mainPortLink">填报端</button>
        </div>
        <div class="server-time" id="serverTime">—</div>
        <div class="server-time">填表人：<span id="whoSubmitter">未填写</span></div>
      </div>
    </aside>

    <div class="sidebar-mask" id="sidebarMask"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="btnMenu" aria-label="菜单">☰</button>
        <div class="title-wrap">
          <h1 id="pageTitle">数据看板</h1>
          <p id="pageSub">今晚的填报情况一目了然</p>
        </div>
        <div class="topbar-right">
          <select id="classSwitcher" class="chip hidden" style="max-width:180px" title="切换班级"></select>
          <span class="chip" id="portBadge">—</span>
          <span class="chip" id="todayChip">—</span>
          <span class="chip" id="submitterChip">填表人：未填写</span>
          <button class="btn tiny" id="btnRefresh">刷新</button>
        </div>
      </header>

      <div id="page" class="page"></div>
    </main>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>
  <div class="modal-mask hidden" id="modalMask"><div class="modal" id="modalBox"></div></div>

  <script src="/vendor/chart.umd.min.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/pages/login.js"></script>
  <script src="/js/pages/overview.js"></script>
  <script src="/js/pages/home.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/report.js"></script>
  <script src="/js/pages/stats.js"></script>
  <script src="/js/pages/records.js"></script>
  <script src="/js/pages/logs.js"></script>
  <script src="/js/pages/fund.js"></script>
  <script src="/js/pages/accounts.js"></script>
  <script src="/js/pages/dorms.js"></script>
  <script src="/js/pages/push.js"></script>
  <script src="/js/pages/console.js"></script>
  <script src="/js/pages/classes.js"></script>
  <script src="/js/pages/config.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
